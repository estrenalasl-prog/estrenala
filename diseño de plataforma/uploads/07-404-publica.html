<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esta web no está publicada</title>
<style>
  :root{--texto:#0f172a;--texto-2:#475569;--texto-3:#94a3b8;--primario:#4f46e5;--primario-osc:#4338ca;--borde:#e2e8f0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:0;padding:24px;color:var(--texto);text-align:center;
    font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(500px 260px at 20% 10%, rgba(79,70,229,.08), transparent 60%),
      radial-gradient(500px 260px at 80% 90%, rgba(14,165,233,.08), transparent 60%),
      #f8fafc;}
  .dibujo{font-size:44px;margin-bottom:14px}
  h1{font-size:30px;font-weight:700;letter-spacing:-.01em;margin:0 0 8px}
  p{margin:0;color:var(--texto-2);max-width:440px}
  .separacion{height:48px}
  /* La marca discreta: también es publicidad */
  .promo{display:flex;flex-direction:column;align-items:center;gap:10px;border-top:1px solid var(--borde);padding-top:24px}
  .marca{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--texto)}
  .marca .simbolo{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff;
    background:linear-gradient(135deg,var(--primario),#0ea5e9);font-size:11px}
  .promo p{font-size:13px;color:var(--texto-3)}
  .promo a{display:inline-flex;align-items:center;height:36px;padding:0 18px;border-radius:8px;
    background:var(--primario);color:#fff;font:600 13px system-ui;text-decoration:none}
  .promo a:hover{background:var(--primario-osc)}
</style>
</head>
<body>
  <div class="dibujo">🚧</div>
  <h1>Esta web aún no está publicada</h1>
  <p>La dirección existe, pero su dueño todavía no ha publicado nada aquí.
     Si es tu web, entra en tu panel y pulsa <b>Publicar</b>.</p>

  <div class="separacion"></div>

  <div class="promo">
    <span class="marca"><span class="simbolo">▲</span>[Marca]</span>
    <p>¿Tu IA te hizo una web y no sabes dónde ponerla?</p>
    <a href="#">Publícala gratis en 2 minutos</a>
  </div>
</body>
</html>
